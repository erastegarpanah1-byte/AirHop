# /etc/turnserver.conf — AirHop TURN server (coturn)
# TURN برای عبور از NAT سخت

listening-port=3478
# tls-listening-port=5349

# آدرس عمومی (در deploy.sh جایگزین میشود)
# external-ip=<PUBLIC_IP>

min-port=49152
max-port=65535

# کاربر و رمز (در deploy.sh جایگزین میشود)
# user=<username>:<password>

no-cli
deny-loopback-ip
no-multicast-peers
total-quota=100
syslog
