name: Build Desktop

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  build-desktop:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            build_cmd: flutter build windows --release
            output_path: app/build/windows/x64/runner/Release
          - os: macos-latest
            artifact: macos
            build_cmd: flutter build macos --release
            output_path: app/build/macos/Build/Products/Release
          - os: ubuntu-latest
            artifact: linux
            build_cmd: flutter build linux --release
            output_path: app/build/linux/x64/release/bundle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev

      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            app/.dart_tool
          key: pub-cache-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Run static analysis
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Build ${{ matrix.artifact }}
        working-directory: app
        run: ${{ matrix.build_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-desktop
          path: ${{ matrix.output_path }}
          retention-days: 30
