name: Build Desktop Electron

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop-electron.yml'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (NSIS installer)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows installer
        working-directory: desktop
        run: npx electron-builder --win --x64
        env:
          # جلوگیری از دانلود Electron دوباره
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-cache

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AirHop-Windows-Setup
          path: desktop/dist/*.exe
          retention-days: 30
