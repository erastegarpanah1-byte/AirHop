name: airhop
description: AirHop — cross-network file transfer app (AirDrop/Send Anywhere clone)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # WebRTC
  flutter_webrtc: ^0.11.0

  # Signaling (WebSocket)
  web_socket_channel: ^2.4.5

  # QR code
  qr_flutter: ^4.1.0

  # Local storage (تاریخچه انتقال‌ها)
  shared_preferences: ^2.2.3

  # File picking (cross-platform)
  file_picker: ^8.0.6

  # Path provider (cross-platform برای دایرکتوری دریافت فایل)
  path_provider: ^2.1.3

  # Animations
  flutter_animate: ^4.5.0

  # UUID
  uuid: ^4.4.0

  # Crypto (برای E2E encryption فایل‌های حساس)
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
