name: airhop
description: AirHop — cross-network file transfer app (AirDrop/Send Anywhere clone)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # WebRTC
  flutter_webrtc: ^0.11.0

  # Signaling (WebSocket)
  web_socket_channel: ^2.4.5

  # HTTP client (برای ساخت اتاق جفت‌سازی)
  http: ^1.2.0

  # QR code
  qr_flutter: ^4.1.0

  # QR / barcode scanner
  mobile_scanner: ^5.2.1

  # Local storage (تاریخچه انتقال‌ها)
  shared_preferences: ^2.2.3

  # File picking (cross-platform)
  file_picker: ^8.0.6

  # Drag & drop (دسکتاپ)
  desktop_drop: ^0.4.4

  # Cross-platform file handle (برای drag & drop)
  cross_file: ^0.3.4

  # Path provider (cross-platform برای دایرکتوری دریافت فایل)
  path_provider: ^2.1.3

  # Device info (برای نمایش مدل گوشی)
  device_info_plus: ^10.1.0

  # Animations
  flutter_animate: ^4.5.0

  # UUID
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Peyda
      fonts:
        - asset: assets/fonts/Peyda-Thin.ttf
          weight: 100
        - asset: assets/fonts/Peyda-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Peyda-Light.ttf
          weight: 300
        - asset: assets/fonts/Peyda-Regular.ttf
          weight: 400
        - asset: assets/fonts/Peyda-Medium.ttf
          weight: 500
        - asset: assets/fonts/Peyda-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Peyda-Bold.ttf
          weight: 700
        - asset: assets/fonts/Peyda-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Peyda-Black.ttf
          weight: 900
